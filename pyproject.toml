[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "create_char_passport"
version = "0.3.0"
description = "Gradio wizard that builds a character 'passport' reference set via the Gemini API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sergey Khlebnikov", email = "you@example.com" }]
keywords = ["python", "ai", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "sentry-sdk>=2.63.0",
    "gradio>=6.19.0",
    "google-genai>=2.9.0",
    "huggingface_hub>=1.20.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.18",
    "pyright>=1.1.410",
    "bandit>=1.7",
    "pip-audit>=2.10.1",
    "pre-commit>=3.7",
    "commitizen>=4.16.4",
]

[project.urls]
Homepage = "https://github.com/hleserg/create-char-passport"
Repository = "https://github.com/hleserg/create-char-passport"
Issues = "https://github.com/hleserg/create-char-passport/issues"

[project.scripts]
create_char_passport = "create_char_passport.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/create_char_passport"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["create_char_passport"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: integration tests (may touch external services)",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["src/create_char_passport"]
omit = ["src/create_char_passport/cli.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.0"
version_files = ["pyproject.toml:version", "src/create_char_passport/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
